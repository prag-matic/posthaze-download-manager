[workspace]
members = [
    "crates/posthaze-engine",
    "crates/posthaze-cli",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
bytes = "1"
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
