name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Test, Clippy, Rustdoc, and Installer Check
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2

      - name: Repo invariants
        shell: pwsh
        run: ./scripts/check-repo.ps1

      - name: Validate Inno Setup script (6.7+)
        shell: pwsh
        run: |
          $iscc = Get-Command iscc -ErrorAction SilentlyContinue | Select-Object -ExpandProperty Source -ErrorAction SilentlyContinue
          $needsUpgrade = $true
          if ($iscc) {
            $whatsnew = Join-Path (Split-Path $iscc -Parent) "whatsnew.htm"
            if ((Test-Path $whatsnew) -and ((Get-Content $whatsnew -TotalCount 80) -match '6\.([7-9]|\d{2})\.')) {
              $needsUpgrade = $false
            }
          }
          if ($needsUpgrade) {
            choco upgrade innosetup -y --no-progress
            $env:Path = "C:\Program Files (x86)\Inno Setup 6;$env:Path"
          }

          # Create temporary placeholders so ISCC validates all directives, assets, and [Code]
          # without requiring a full LTO release build on every PR.
          New-Item -ItemType Directory -Force -Path "target\release" | Out-Null
          $placeholders = @("target\release\posthaze-ui.exe", "target\release\posthaze-cli.exe")
          foreach ($f in $placeholders) {
            if (-not (Test-Path $f)) { New-Item -ItemType File -Force -Path $f | Out-Null }
          }
          try {
            iscc /Qp /O"$env:RUNNER_TEMP" packaging\windows\posthaze.iss
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } finally {
            foreach ($f in $placeholders) { Remove-Item -Force $f -ErrorAction SilentlyContinue }
          }

      - name: Run tests
        run: cargo test --workspace

      - name: Run clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Build documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --no-deps
