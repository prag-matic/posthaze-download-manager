name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-windows:
    name: Build Windows Installer & Portable ZIP
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - name: Repo invariants
        shell: pwsh
        run: ./scripts/check-repo.ps1

      - name: Verify tag matches Cargo.toml version
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $cargo = Get-Content Cargo.toml -Raw
          $null = $cargo -match '(?ms)\[workspace\.package\].*?^version\s*=\s*"([^"]+)"'
          if ("v$($Matches[1])" -ne $env:GITHUB_REF_NAME) { throw "Tag $env:GITHUB_REF_NAME != Cargo.toml v$($Matches[1])" }

      - name: Verify documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --no-deps

      - name: Run clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Run test suite
        run: cargo test --workspace

      - name: Build release binaries
        run: cargo build --release --workspace

      - name: Package portable ZIP
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_TYPE -eq "tag") { $tag = $env:GITHUB_REF_NAME } else {
            $null = (Get-Content Cargo.toml -Raw) -match '(?ms)\[workspace\.package\].*?^version\s*=\s*"([^"]+)"'
            $tag = "v$($Matches[1])"
          }
          $ver = $tag.TrimStart("v")
          $isPrerelease = if ($ver -match '-') { "true" } else { "false" }
          "RELEASE_VERSION=$ver" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "IS_PRERELEASE=$isPrerelease" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $staging = "dist\portable-staging\posthaze-$ver-windows-x64"
          New-Item -ItemType Directory -Force -Path $staging | Out-Null

          Copy-Item "target\release\posthaze-ui.exe" -Destination $staging
          Copy-Item "target\release\posthaze-cli.exe" -Destination $staging
          New-Item -ItemType File -Force -Path "$staging\posthaze.portable" | Out-Null
          Copy-Item "extensions" -Destination "$staging\extensions" -Recurse

          $zipPath = "dist\posthaze-$ver-windows-x64-portable.zip"
          Compress-Archive -Path "$staging\*" -DestinationPath $zipPath -Force
          Remove-Item -Recurse -Force "dist\portable-staging"

      - name: Build Inno Setup installer (6.7+)
        shell: pwsh
        run: |
          $iscc = Get-Command iscc -ErrorAction SilentlyContinue | Select-Object -ExpandProperty Source -ErrorAction SilentlyContinue
          $needsUpgrade = $true
          if ($iscc) {
            $whatsnew = Join-Path (Split-Path $iscc -Parent) "whatsnew.htm"
            if ((Test-Path $whatsnew) -and ((Get-Content $whatsnew -TotalCount 80) -match '6\.([7-9]|\d{2})\.')) {
              $needsUpgrade = $false
            }
          }
          if ($needsUpgrade) {
            choco upgrade innosetup -y --no-progress
            $env:Path = "C:\Program Files (x86)\Inno Setup 6;$env:Path"
          }
          iscc "/DMyAppVersion=$env:RELEASE_VERSION" packaging\windows\posthaze.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Sign & verify installer (Ed25519)
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          UPDATER_SIGNING_KEY: ${{ secrets.UPDATER_SIGNING_KEY }}
        run: |
          if (-not $env:UPDATER_SIGNING_KEY) {
            throw "UPDATER_SIGNING_KEY secret is not configured for tagged release"
          }
          $setup = "dist\posthaze-$env:RELEASE_VERSION-windows-x64-setup.exe"
          cargo run --release -p posthaze-keytool -- sign $setup
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          # Cryptographically verify .sig against ACCEPTED_PUBLIC_KEYS embedded in posthaze-ui
          $updaterSrc = Get-Content "crates\posthaze-ui\src\updater.rs" -Raw
          if ($updaterSrc -notmatch '(?ms)ACCEPTED_PUBLIC_KEYS:\s*&\[&str\]\s*=\s*&\[([^\]]+)\]') {
            throw "Could not parse ACCEPTED_PUBLIC_KEYS from updater.rs"
          }
          [string[]]$pubKeys = @([regex]::Matches($Matches[1], '"([^"]+)"') | ForEach-Object { $_.Groups[1].Value })
          if (-not $pubKeys) { throw "No public keys found in ACCEPTED_PUBLIC_KEYS" }

          cargo run --release -p posthaze-keytool -- verify $setup "$setup.sig" @pubKeys
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Generate & verify SHA-256 checksums
        shell: pwsh
        run: |
          $files = Get-ChildItem dist\*.exe, dist\*.zip | Sort-Object Name
          $lines = foreach ($f in $files) {
            $hash = (Get-FileHash $f.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($f.Name)"
          }
          $lines | Set-Content -Path "dist\SHA256SUMS.txt" -Encoding ascii

          # Verify every line in SHA256SUMS.txt matches disk
          foreach ($line in (Get-Content "dist\SHA256SUMS.txt")) {
            $parts = $line -split '\s+'
            $expected = $parts[0]
            $name = $parts[1]
            $actual = (Get-FileHash "dist\$name" -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($actual -ne $expected) { throw "SHA-256 verification failed for $name" }
          }
          Write-Host "Verified SHA256SUMS.txt for $($files.Count) release artifacts."

      - name: Prepare release notes (hybrid CHANGELOG.md + fallback)
        shell: pwsh
        run: |
          $ver = $env:RELEASE_VERSION
          $hasChangelogSection = $false
          $sectionBody = ""

          if (Test-Path "CHANGELOG.md") {
            $raw = Get-Content "CHANGELOG.md" -Raw
            $pattern = "(?ms)^##\s+\[$([regex]::Escape($ver))\][^\r\n]*\r?\n(.*?)(?=^##\s+\[|\z)"
            if ($raw -match $pattern) {
              $sectionBody = $Matches[1].Trim()
              if ($sectionBody.Length -gt 0) { $hasChangelogSection = $true }
            }
          }

          $footer = @"
---

### Downloads
- **Installer (``posthaze-$ver-windows-x64-setup.exe``):** Per-user Windows installer (no admin required) with the desktop app, CLI, and Chrome extension.
- **Portable (``posthaze-$ver-windows-x64-portable.zip``):** Extract and run anywhere; keeps all data and logs in ``./data/``.

### SmartScreen Note
Binaries are currently unsigned. If Windows SmartScreen warns you, click **More info** -> **Run anyway** after checking the file hash against ``SHA256SUMS.txt``:

``````powershell
Get-FileHash .\posthaze-$ver-windows-x64-setup.exe -Algorithm SHA256
``````
"@

          if ($hasChangelogSection) {
            $notes = "## Posthaze Download Manager v$ver (Windows x64)`n`n$sectionBody`n`n$footer"
            "USE_AUTO_NOTES=false" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          } else {
            $notes = "## Posthaze Download Manager v$ver (Windows x64)`n`n$footer"
            "USE_AUTO_NOTES=true" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          }
          $notes | Set-Content -Path "dist\RELEASE_NOTES.md" -Encoding utf8

      - name: Upload dry-run artifacts (workflow_dispatch)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: posthaze-${{ env.RELEASE_VERSION }}-windows-x64-dryrun
          path: |
            dist/*.exe
            dist/*.zip
            dist/SHA256SUMS.txt
            dist/RELEASE_NOTES.md
          retention-days: 7

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          prerelease: ${{ env.IS_PRERELEASE == 'true' }}
          generate_release_notes: ${{ env.USE_AUTO_NOTES == 'true' }}
          body_path: dist/RELEASE_NOTES.md
          files: |
            dist/*.exe
            dist/*.sig
            dist/*.zip
            dist/SHA256SUMS.txt
