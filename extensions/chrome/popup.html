<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Posthaze</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #141311;
      --elevated: #1b1a17;
      --surface: #1e1d1a;
      --border: #2a2825;
      --text: #eae6df;
      --muted: #9b968d;
      --accent: #e58a35;
      --accent-fg: #141311;
      --ok: #22c55e;
      --err: #ef4444;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      width: 312px;
      background: var(--bg);
      color: var(--text);
      font: 12px/1.4 "Segoe UI", system-ui, sans-serif;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 10px;
      background: var(--elevated);
      border-bottom: 1px solid var(--border);
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 7px;
    }
    .brand img { width: 16px; height: 16px; }
    .title {
      font-family: Consolas, monospace;
      font-weight: 700;
      letter-spacing: 0.05em;
      font-size: 11px;
    }
    .pill {
      padding: 2px 6px;
      border: 1px solid var(--border);
      background: var(--bg);
      font-family: Consolas, monospace;
      font-size: 10px;
      color: var(--muted);
    }
    .pill.online { border-color: var(--ok); color: var(--ok); }
    .pill.host { border-color: var(--accent); color: var(--accent); }
    .pill.offline { border-color: var(--err); color: var(--err); }
    .body {
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 7px 9px;
      background: var(--surface);
      border: 1px solid var(--border);
      cursor: pointer;
    }
    .row input[type="checkbox"] {
      accent-color: var(--accent);
      margin: 0;
    }
    .site-btn {
      width: 100%;
      color: var(--text);
      font: inherit;
      text-align: left;
    }
    .site-btn:hover { border-color: var(--accent); }
    .site-btn[hidden] { display: none; }
    .site-host {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      color: var(--muted);
    }
    .site-action {
      font-family: Consolas, monospace;
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.03em;
      color: var(--accent);
      flex-shrink: 0;
    }
    .site-btn.excluded .site-action {
      color: var(--ok);
    }
    .actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      border: 1px solid var(--border);
    }
    .btn {
      height: 30px;
      border: 0;
      background: var(--elevated);
      color: var(--text);
      font-family: Consolas, monospace;
      font-size: 10.5px;
      font-weight: 600;
      letter-spacing: 0.03em;
      cursor: pointer;
    }
    .btn + .btn { border-left: 1px solid var(--border); }
    .btn.primary {
      background: var(--accent);
      color: var(--accent-fg);
    }
    .btn:hover { filter: brightness(1.08); }
    details.filters {
      border: 1px solid var(--border);
      background: var(--surface);
    }
    details.filters summary {
      list-style: none;
      padding: 6px 9px;
      font-family: Consolas, monospace;
      font-size: 10.5px;
      color: var(--muted);
      cursor: pointer;
      user-select: none;
    }
    details.filters[open] summary {
      border-bottom: 1px solid var(--border);
      color: var(--text);
    }
    .filter-grid {
      padding: 8px 9px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .field {
      display: flex;
      align-items: center;
      border: 1px solid var(--border);
      background: var(--bg);
      height: 26px;
    }
    .field label {
      width: 90px;
      padding: 0 7px;
      height: 100%;
      display: flex;
      align-items: center;
      background: var(--elevated);
      border-right: 1px solid var(--border);
      font-family: Consolas, monospace;
      font-size: 10px;
      color: var(--muted);
      flex-shrink: 0;
    }
    .field input {
      flex: 1;
      min-width: 0;
      height: 100%;
      border: 0;
      outline: 0;
      padding: 0 7px;
      background: transparent;
      color: var(--text);
      font-family: Consolas, monospace;
      font-size: 11px;
    }
    .status {
      padding: 7px 9px;
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--muted);
      font-family: Consolas, monospace;
      font-size: 10.5px;
      word-break: break-word;
    }
    .status.ok { border-left: 2px solid var(--ok); color: var(--text); }
    .status.err { border-left: 2px solid var(--err); color: var(--err); }
    .status-url {
      color: var(--muted);
      font-size: 10px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-bottom: 2px;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="brand">
      <img src="icons/icon-32.png" alt="Posthaze" />
      <span class="title">POSTHAZE BRIDGE</span>
    </div>
    <span id="host-pill" class="pill">CHECKING</span>
  </div>

  <div class="body">
    <label class="row">
      <span>Intercept browser downloads</span>
      <input id="intercept-toggle" type="checkbox" />
    </label>

    <button id="site-exclude-btn" class="row site-btn" type="button" hidden>
      <span id="site-exclude-host" class="site-host"></span>
      <span id="site-exclude-label" class="site-action">EXCLUDE SITE</span>
    </button>

    <div class="actions">
      <button id="open-ui-btn" class="btn primary" type="button">OPEN POSTHAZE</button>
      <button id="ping-btn" class="btn" type="button">PING HOST</button>
    </div>

    <details class="filters">
      <summary>CAPTURE FILTERS</summary>
      <div class="filter-grid">
        <div class="field">
          <label for="min-size">MIN MIB</label>
          <input id="min-size" type="number" min="0" step="0.5" placeholder="0" />
        </div>
        <div class="field">
          <label for="skip-ext">SKIP EXT</label>
          <input id="skip-ext" type="text" placeholder="svg, crx, xpi, html, htm" />
        </div>
        <div class="field">
          <label for="skip-dom">SKIP HOST</label>
          <input id="skip-dom" type="text" placeholder="localhost, 127.0.0.1" />
        </div>
      </div>
    </details>

    <div id="status-box" class="status">Ready.</div>
  </div>

  <script type="module" src="popup.js"></script>
</body>
</html>
